version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "Microsoft.CodeAnalysis*"
      test:
        patterns:
          - "xunit*"
      providers:
        patterns:
          - "Microsoft.Data.Sqlite*"
          - "Npgsql*"
          - "MySqlConnector*"
          - "Microsoft.Data.SqlClient*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
